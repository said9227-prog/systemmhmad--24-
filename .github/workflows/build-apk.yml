name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Verify Java
      # ============================================================
      - name: Verify Java environment
        shell: bash
        run: |
          set -e

          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')

          if [ -z "$JAVA_VERSION" ]; then
            echo "ERROR: Failed to detect Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F '.' \
            '{if ($1 == 1) print $2; else print $1}')

          echo "Detected Java version: $JAVA_VERSION"
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher."
            exit 1
          fi

          echo "Java environment verified successfully."

      # ============================================================
      # 4. Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # ============================================================
      # 5. Restore PERMANENT signing keystore
      # ============================================================
      - name: Restore permanent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          KEYSTORE="$HOME/.android/debug.keystore"
          PROJECT_KEYSTORE="${{ github.workspace }}/debug.keystore"

          echo "============================================================"
          echo "RESTORING PERMANENT SIGNING KEYSTORE"
          echo "============================================================"

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo ""
            echo "ERROR: DEBUG_KEYSTORE_BASE64 is not configured."
            echo ""
            echo "The permanent signing keystore is required."
            echo "Build stopped."
            exit 1
          fi

          mkdir -p "$HOME/.android"

          echo "Decoding DEBUG_KEYSTORE_BASE64..."

          if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"; then

            echo ""
            echo "ERROR: Failed to decode DEBUG_KEYSTORE_BASE64."
            echo "The GitHub Secret does not contain valid Base64 data."
            exit 1
          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore was not created."
            exit 1
          fi

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore is empty."
            exit 1
          fi

          # IMPORTANT:
          # build.gradle.kts uses:
          # ${rootDir}/debug.keystore
          cp "$KEYSTORE" "$PROJECT_KEYSTORE"

          if [ ! -f "$PROJECT_KEYSTORE" ]; then
            echo "ERROR: Failed to copy keystore into project root."
            exit 1
          fi

          if [ ! -s "$PROJECT_KEYSTORE" ]; then
            echo "ERROR: Project debug.keystore is empty."
            exit 1
          fi

          echo ""
          echo "Permanent keystore restored successfully."

          echo ""
          echo "Project keystore:"
          ls -lh "$PROJECT_KEYSTORE"

      # ============================================================
      # 6. Verify permanent keystore + SHA-1
      # ============================================================
      - name: Verify permanent signing keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="${{ github.workspace }}/debug.keystore"

          echo "============================================================"
          echo "VERIFYING PERMANENT SIGNING KEYSTORE"
          echo "============================================================"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Project debug.keystore does not exist."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey > /dev/null 2>&1; then

            echo ""
            echo "ERROR: debug.keystore is invalid."
            echo ""
            echo "Expected:"
            echo "Alias: androiddebugkey"
            echo "Password: android"
            exit 1
          fi

          echo "Keystore structure verified successfully."

          KEYSTORE_SHA1=$(keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | awk -F': ' '/SHA1:/ {print $2; exit}')

          if [ -z "$KEYSTORE_SHA1" ]; then
            echo "ERROR: Could not read SHA-1 from keystore."
            exit 1
          fi

          # Normalize SHA-1:
          # Remove spaces, colon and dash.
          KEYSTORE_SHA1_NORMALIZED=$(echo "$KEYSTORE_SHA1" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]')

          if [ -z "$KEYSTORE_SHA1_NORMALIZED" ]; then
            echo "ERROR: Normalized SHA-1 is empty."
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "PERMANENT KEYSTORE SHA-1"
          echo "============================================================"
          echo "$KEYSTORE_SHA1_NORMALIZED"
          echo "============================================================"

          echo "KEYSTORE_SHA1=$KEYSTORE_SHA1_NORMALIZED" >> "$GITHUB_ENV"

          echo ""
          echo "Permanent signing keystore verification successful."

      # ============================================================
      # 7. Verify Gradle wrapper
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 9.3.1."
          fi

      # ============================================================
      # 8. Build APK
      # ============================================================
      - name: Build the debug APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING DEBUG APK"
          echo "============================================================"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo ""
          echo "Gradle build completed successfully."

      # ============================================================
      # 9. Verify APK exists
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "============================================================"
          echo "VERIFYING APK"
          echo "============================================================"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: APK not found:"
            echo "$TARGET_APK"

            echo ""
            echo "Available APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$TARGET_APK")

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK size is suspiciously small."
            exit 1
          fi

          echo ""
          echo "APK verified successfully."

      # ============================================================
      # 10. Find apksigner
      # ============================================================
      - name: Find apksigner
        id: apksigner
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "FINDING APKSIGNER"
          echo "============================================================"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not configured."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "apksigner found:"
          echo "$APKSIGNER"

          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Verify APK signature
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${{ steps.apksigner.outputs.path }}"

          echo "============================================================"
          echo "VERIFYING APK SIGNATURE"
          echo "============================================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$TARGET_APK"

          echo ""
          echo "APK signature verification successful."

      # ============================================================
      # 12. Compare APK SHA-1 with permanent keystore SHA-1
      # ============================================================
      - name: Verify APK uses permanent signing key
        shell: bash
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${{ steps.apksigner.outputs.path }}"

          echo "============================================================"
          echo "CHECKING SIGNING CERTIFICATE"
          echo "============================================================"

          CERT_OUTPUT=$("$APKSIGNER" verify \
            --print-certs \
            "$TARGET_APK")

          echo ""
          echo "APK certificate information:"
          echo "$CERT_OUTPUT"

          # Extract SHA-1 from apksigner output.
          APK_SHA1=$(echo "$CERT_OUTPUT" \
            | grep -i "certificate SHA-1 digest" \
            | sed 's/.*: //' \
            | tr -d '[:space:]:-')

          if [ -z "$APK_SHA1" ]; then
            echo ""
            echo "ERROR: Could not extract APK SHA-1."
            echo ""
            echo "Full certificate output:"
            echo "$CERT_OUTPUT"
            exit 1
          fi

          # Normalize both fingerprints.
          # This is critical because:
          #
          # Keystore:
          # A2:F8:49:F6:...
          #
          # APK:
          # A2F849F6...
          #
          # Both become:
          # A2F849F6...
          APK_SHA1_NORMALIZED=$(echo "$APK_SHA1" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]')

          KEYSTORE_SHA1_NORMALIZED=$(echo "$KEYSTORE_SHA1" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]')

          echo ""
          echo "============================================================"
          echo "PERMANENT KEYSTORE SHA-1"
          echo "============================================================"
          echo "$KEYSTORE_SHA1_NORMALIZED"

          echo ""
          echo "============================================================"
          echo "FINAL APK SHA-1"
          echo "============================================================"
          echo "$APK_SHA1_NORMALIZED"

          echo ""
          echo "============================================================"
          echo "SIGNING KEY COMPARISON"
          echo "============================================================"

          if [ "$KEYSTORE_SHA1_NORMALIZED" != "$APK_SHA1_NORMALIZED" ]; then

            echo ""
            echo "ERROR: SIGNING KEY MISMATCH!"
            echo ""
            echo "The APK was NOT signed with the permanent keystore."
            echo ""
            echo "Permanent keystore:"
            echo "$KEYSTORE_SHA1_NORMALIZED"
            echo ""
            echo "APK:"
            echo "$APK_SHA1_NORMALIZED"
            echo ""
            echo "BUILD STOPPED."
            echo "The APK will NOT be released."
            exit 1
          fi

          # Convert normalized SHA-1 to standard colon format.
          APK_SHA1_COLON=$(echo "$APK_SHA1_NORMALIZED" \
            | sed 's/../&:/g' \
            | sed 's/:$//')

          echo ""
          echo "============================================================"
          echo "SUCCESS"
          echo "============================================================"
          echo ""
          echo "The APK is signed with the permanent signing key."
          echo ""
          echo "SHA-1 fingerprints match exactly."
          echo ""
          echo "FINAL APK SHA-1:"
          echo "$APK_SHA1_COLON"
          echo ""
          echo "============================================================"

      # ============================================================
      # 13. Display final APK information
      # ============================================================
      - name: Display APK information
        shell: bash
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "============================================================"
          echo "FINAL APK INFORMATION"
          echo "============================================================"

          ls -lh "$TARGET_APK"

          echo ""
          echo "APK:"
          echo "$TARGET_APK"

          echo ""
          echo "Application ID:"
          echo "com.aistudio.clientaccountspro.txvdwz"

          echo ""
          echo "Permanent signing SHA-1:"
          echo "$KEYSTORE_SHA1"

          echo ""
          echo "APK is ready for release."

      # ============================================================
      # 14. Upload APK artifact
      # ============================================================
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 15. Publish GitHub Release
      # ============================================================
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="v${{ github.run_number }}-$(date +%s)"

          echo "============================================================"
          echo "CREATING GITHUB RELEASE"
          echo "============================================================"

          echo "Release tag:"
          echo "$TAG"

          gh release create "$TAG" \
            "$TARGET_APK" \
            --title "Debug Build $TAG" \
            --notes "Automated Debug APK release via GitHub Actions."

          echo ""
          echo "============================================================"
          echo "BUILD AND RELEASE COMPLETED SUCCESSFULLY"
          echo "============================================================"
